name: Android CI

on:
  push:
    # CI builds run on both main and develop.
    branches: [ "main", "develop" ]
    # Release tags: handled by the main-only gate in publish-release below.
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create local.properties
      run: |
        echo "etherscan.testnet.api.key=${{ secrets.ETHERSCAN_TESTNET_API_KEY }}" >> local.properties
        echo "etherscan.mainnet.api.key=${{ secrets.ETHERSCAN_MAINNET_API_KEY }}" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew assembleProductionMainnetRelease assembleProductionMainnetDebug

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-productionMainnet-release
        path: composeApp/build/outputs/apk/productionMainnet/release/*.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-productionMainnet-debug
        path: composeApp/build/outputs/apk/productionMainnet/debug/*.apk

  desktop-build:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each OS builds BOTH networks (testnet + mainnet); -PkkNetwork bakes the
        # network into the jar/installer and its filename, so both variants ship.
        kkNetwork: [testnet, mainnet]
        include:
          - os: ubuntu-latest
            target: linux
            task: :composeApp:packageDeb :composeApp:packageRpm :composeApp:packageUberJarForCurrentOS
            # Installers live under binaries/main/; the (network-named) jar under jars/.
            artifact-path: |
              composeApp/build/compose/binaries/main/
              composeApp/build/compose/jars/
            install-deps: |
              sudo apt-get update
              sudo apt-get install -y fakeroot dpkg-dev rpm
          - os: macos-latest
            target: macos
            task: :composeApp:packageDmg
            artifact-path: composeApp/build/compose/binaries/main/dmg/
            install-deps: ""
          - os: windows-latest
            target: windows
            task: :composeApp:packageMsi
            artifact-path: composeApp/build/compose/binaries/main/msi/
            install-deps: ""

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      if: runner.os != 'Windows'
      run: chmod +x gradlew

    - name: Create local.properties (Etherscan keys baked into the jar/installer)
      run: |
        echo "etherscan.testnet.api.key=${{ secrets.ETHERSCAN_TESTNET_API_KEY }}" >> local.properties
        echo "etherscan.mainnet.api.key=${{ secrets.ETHERSCAN_MAINNET_API_KEY }}" >> local.properties

    - name: Install packaging dependencies
      if: matrix.install-deps != ''
      run: ${{ matrix.install-deps }}

    - name: Build desktop packages (${{ matrix.kkNetwork }})
      run: ./gradlew -PkkNetwork=${{ matrix.kkNetwork }} ${{ matrix.task }}

    - name: Upload installers
      uses: actions/upload-artifact@v4
      with:
        name: CoinSafeBox-${{ matrix.target }}-${{ matrix.kkNetwork }}
        path: ${{ matrix.artifact-path }}
        if-no-files-found: error

  publish-release:
    name: Publish Release (main only)
    # Releases are published only for v* tags whose commit lives on main -- never
    # from develop or other branches. always() keeps it best-effort so a successful
    # build (e.g. the Windows .msi) still reaches the release even if a leg failed.
    needs: [desktop-build]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout (full history)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify tagged commit is on main (releases are main-only)
      id: gate
      run: |
        git fetch --depth=1 origin main
        if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "on_main=true" >> "$GITHUB_OUTPUT"
          echo "Tagged commit is on main -> publishing release."
        else
          echo "on_main=false" >> "$GITHUB_OUTPUT"
          echo "Tagged commit is NOT on main -> skipping release (main-only policy)."
        fi

    - name: Download all artifacts
      if: steps.gate.outputs.on_main == 'true'
      uses: actions/download-artifact@v4
      with:
        path: release-assets
        if-no-files-found: ignore

    - name: List collected assets
      if: steps.gate.outputs.on_main == 'true'
      run: |
        echo "Artifacts collected for release:"
        find release-assets -type f | sort || true

    - name: Publish to GitHub Release
      if: steps.gate.outputs.on_main == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        fail_on_unmatched_files: false
        draft: false
        prerelease: false
        files: |
          release-assets/**/*.apk
          release-assets/**/*.deb
          release-assets/**/*.rpm
          release-assets/**/*.msi
          release-assets/**/*.dmg
          release-assets/**/*.jar
